name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Once a day as well: the proxy changes in its own repository, and the job
  # below is what tells this site that a change there broke it.
  schedule:
    - cron: "0 5 * * *"

# The jobs only read: they check out code, build and test. Said here rather
# than left to the repository's default, so a change of that default gives
# them nothing more.
permissions:
  contents: read

# Every action is pinned to the commit of the release named beside it: a tag
# can be moved to other code, a commit cannot.
jobs:
  build:
    name: Build and test release artifact
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Node 22 rather than the newest: it is what the Cloud Functions in this
      # project run on, so the site and its functions are built the same way.
      - name: Set up Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm

          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm --prefix functions ci --prefer-offline --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run coverage
      # build includes tsc -b.
      - run: npm run build
      - run: npm --prefix functions run check
      - name: Cache Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Smoke the actual production build
        run: node scripts/smoke-build.mjs
      - name: Pack this push's checked output
        if: github.event_name == 'push'
        run: node scripts/release-artifact.mjs pack "$GITHUB_SHA" "$GITHUB_RUN_ID"
      - name: Keep checked output for cloud and local delivery
        if: github.event_name == 'push'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: web-release-${{ github.sha }}
          path: |
            .firebase/cd/bundle.tar
            .firebase/cd/manifest.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  browsers:
    name: Browser smokes (${{ matrix.shard }}/4)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Cache Chromium and WebKit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-both-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: failure()
        with:
          name: browser-traces-${{ matrix.shard }}
          path: test-results
          retention-days: 7

  check:
    # Keep the protected branch's existing required check; no failed/skipped shard can pass.
    name: Typecheck, lint, test, build
    needs: [build, browsers]
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - run: test "$BUILD" = success && test "$BROWSERS" = success
        env:
          BUILD: ${{ needs.build.result }}
          BROWSERS: ${{ needs.browsers.result }}

  proxy:
    # The site against the real backend code in the Firebase emulators:
    # the proxy's main and this repository's functions (e2e-proxy/README.md).
    name: Against the proxy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The proxy's main as it is today, on purpose not pinned to a commit:
      # telling this site when a change there breaks it is what this job, and
      # its daily run, are for.
      - name: Checkout the proxy's main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: kellygracelab-dotcom/tieryourlife-proxy
          ref: main
          path: proxy

      - name: Set up Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            proxy/functions/package-lock.json

      # The Firestore and Storage emulators are Java programs.
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Keep the emulators' downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-15.34.2

      # firebase-tools at an exact version, as a lock file would hold it; the
      # emulators' cache above is kept per version too.
      - name: Install
        run: |
          npm ci
          npm --prefix functions ci
          npm --prefix proxy/functions ci
          npm install --global firebase-tools@15.34.2

      - name: Cache Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install the smoke browser
        run: npx playwright install --with-deps chromium

      - name: Smokes against the proxy
        run: npm run e2e:proxy
        env:
          TYL_PROXY_DIR: proxy

      - name: Keep the smoke traces
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: proxy-smokes
          path: test-results/proxy
          retention-days: 7

  production:
    name: Deploy and verify production
    needs: [check, proxy]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER != '' && vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    environment: web-production
    concurrency:
      group: tieryourlife-web-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Restore the checked build from this push
        run: node scripts/release-artifact.mjs restore "$GITHUB_SHA" "$GITHUB_RUN_ID"
      - name: Install pinned deployment CLI
        run: npm install --global firebase-tools@15.34.2 --prefer-offline --no-audit --no-fund
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: tieryourlife
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy checked artifact to Web production
        run: npm run deploy:firebase
      - name: Verify public revision, HTML, JavaScript and Web APIs
        run: |
          npm run verify:production
          node scripts/record-release.mjs
      - name: Keep verified Functions baseline
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: web-verified-${{ github.sha }}
          path: .firebase/cd/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 90
