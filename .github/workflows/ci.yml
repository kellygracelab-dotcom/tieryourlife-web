name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Once a day as well: the proxy changes in its own repository, and the job
  # below is what tells this site that a change there broke it.
  schedule:
    - cron: "0 5 * * *"

jobs:
  check:
    name: Typecheck, lint, test, build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Node 22 rather than the newest: it is what the Cloud Functions in this
      # project run on, so the site and its functions are built the same way.
      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install functions
        run: npm --prefix functions ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Build and test functions
        run: npm --prefix functions run check

      - name: Install the smoke browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Browser smokes
        run: npm run e2e

      - name: Keep the smoke report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  proxy:
    # The site against the real backend code in the Firebase emulators:
    # the proxy's main and this repository's functions (e2e-proxy/README.md).
    name: Against the proxy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout the proxy's main
        uses: actions/checkout@v5
        with:
          repository: kellygracelab-dotcom/tieryourlife-proxy
          ref: main
          path: proxy

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            proxy/functions/package-lock.json

      # The Firestore and Storage emulators are Java programs.
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Keep the emulators' downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-15

      - name: Install
        run: |
          npm ci
          npm --prefix functions ci
          npm --prefix proxy/functions ci
          npm install --global firebase-tools@15

      - name: Install the smoke browser
        run: npx playwright install --with-deps chromium

      - name: Smokes against the proxy
        run: npm run e2e:proxy
        env:
          TYL_PROXY_DIR: proxy

      - name: Keep the smoke traces
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: proxy-smokes
          path: test-results/proxy
          retention-days: 7
