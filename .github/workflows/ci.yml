name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22 rather than the newest: it is what the Cloud Functions in this
      # project run on, so the site and its functions are built the same way.
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install functions
        run: npm --prefix functions ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Build and test functions
        run: npm --prefix functions run check

      - name: Install the smoke browser
        run: npx playwright install --with-deps chromium

      - name: Browser smokes
        run: npm run e2e

      - name: Keep the smoke report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
