<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // tieryourlife.com is the site's one address (Danylo, 20.11.2026): on
      // Firebase's own hosts for it, and on www, the same page opens there.
      if (
        ["tieryourlife.web.app", "tieryourlife.firebaseapp.com", "www.tieryourlife.com"].indexOf(
          location.hostname,
        ) >= 0
      )
        location.replace(
          "https://tieryourlife.com" + location.pathname + location.search + location.hash,
        );
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Rank anything, or take someone else's list and rank it your way."
    />
    <meta name="theme-color" content="#fbf8ff" />
    <script>
      // The kept scheme goes on <html> before the first paint; the stylesheet does the rest.
      try {
        var theme = localStorage.getItem("tyl:theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        // And the colour's palette as last drawn (lib/colourTheme.ts), Lavender being none.
        var look = localStorage.getItem("tyl:colour-look");
        if (look) {
          var style = document.createElement("style");
          style.id = "tyl-colour";
          style.textContent = look;
          document.head.appendChild(style);
        }
      } catch (e) {}
    </script>
    <script>
      // A link opened just after a deploy can bring a page naming the old
      // script, now gone: it never runs, and the page stays white. One reload,
      // past any cache, brings the new page; boot.ts keeps the same try and
      // clears it once the site starts. A second failure says so in words.
      addEventListener(
        "error",
        function (event) {
          var script = event.target;
          if (!script || script.tagName !== "SCRIPT" || script.type !== "module") return;
          try {
            if (sessionStorage.getItem("tyl:boot-retry") === null) {
              sessionStorage.setItem("tyl:boot-retry", "1");
              var address = new URL(location.href);
              address.searchParams.set("tyl-fresh", String(Date.now()));
              location.replace(address.href);
              return;
            }
            sessionStorage.removeItem("tyl:boot-retry");
          } catch (e) {}
          var root = document.getElementById("root");
          if (!root) return;
          // boot.ts's screen, simpler: the same classes, which the site's
          // stylesheet dresses when it came; plain words in a column when not.
          var section = document.createElement("section");
          section.className = "reload-notice";
          section.setAttribute("role", "alert");
          var title = document.createElement("h1");
          title.className = "reload-notice__title";
          title.textContent = "The site could not start";
          var body = document.createElement("p");
          body.className = "reload-notice__text";
          body.textContent =
            "Part of it did not arrive: the connection dropped, or the site was updated this very minute. Reloading usually does it.";
          var button = document.createElement("button");
          button.type = "button";
          button.className = "reload-notice__reload";
          button.textContent = "Reload";
          button.addEventListener("click", function () {
            location.reload();
          });
          var actions = document.createElement("div");
          actions.className = "reload-notice__actions";
          actions.append(button);
          section.append(title, body, actions);
          root.replaceChildren(section);
          if (getComputedStyle(section).display !== "flex") {
            section.style.cssText =
              "max-width:40rem;margin:0 auto;padding:72px 16px;font-family:sans-serif;text-align:center";
          }
        },
        true,
      );
    </script>
    <!-- Until the site moves to its final address; robots.txt says the same. -->
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The icons are words until their font arrives; it is small and asked for first. -->
    <link
      rel="preload"
      href="/fonts/material-symbols-outlined.woff2?v=d14fe35b01"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>TierYourLife</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
